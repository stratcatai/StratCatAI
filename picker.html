<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StratCat Magic Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Vercel Web Analytics + Speed Insights (free, privacy-friendly pageview/perf tracking) -->
    <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="max-w-lg mx-auto pt-10 px-6">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex justify-center gap-4 mb-4">
                <span class="text-6xl">🐱</span>
                <span class="text-6xl">🔮</span>
            </div>
            <h1 class="text-4xl font-bold">StratCat Magic Picker</h1>
            <p class="text-zinc-400">The wise cat always knows best</p>
        </div>

        <!-- Result Area (Now at the top) -->
        <div id="result" class="hidden bg-gradient-to-br from-purple-900/50 to-violet-900/50 border border-purple-500/30 rounded-3xl p-8 mb-10 text-center">
            <p class="text-purple-300 mb-3 text-sm tracking-widest">THE WISE CAT HAS SPOKEN</p>
            <div id="selected" class="text-3xl font-semibold min-h-[80px] flex items-center justify-center"></div>
        </div>

        <!-- Magic Ball -->
        <div onclick="pickRandom()" class="relative mx-auto w-64 h-64 cursor-pointer mb-12">
            <div class="absolute inset-0 bg-gradient-to-br from-purple-600 via-violet-600 to-fuchsia-600 rounded-full shadow-2xl flex items-center justify-center text-8xl hover:rotate-12 transition-transform">
                🎱
            </div>
        </div>

        <!-- Add Items -->
        <div class="bg-zinc-900 rounded-3xl p-6 mb-8">
            <input id="input" type="text" placeholder="Type an option and press Enter..." 
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-purple-500 text-lg mb-4">
            <button onclick="addItem()" class="w-full py-4 bg-purple-600 hover:bg-purple-700 rounded-2xl font-semibold">Add to List</button>
        </div>

        <!-- List -->
        <div class="bg-zinc-900 rounded-3xl p-6">
            <div class="flex justify-between mb-4">
                <span class="font-medium">Your Options (<span id="count">0</span>)</span>
                <button onclick="clearList()" class="text-red-400 hover:text-red-500">Clear All</button>
            </div>
            <div id="list" class="space-y-2 max-h-96 overflow-auto"></div>
        </div>
    </div>

    <script>
        let items = [];

        const input = document.getElementById('input');

        input.addEventListener('keypress', e => { if (e.key === "Enter") addItem(); });

        function addItem() {
            if (input.value.trim()) {
                items.push(input.value.trim());
                input.value = '';
                renderList();
            }
        }

        function renderList() {
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            document.getElementById('count').textContent = items.length;

            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'bg-zinc-800 rounded-2xl px-5 py-4 flex justify-between group';
                div.innerHTML = `<span>${item}</span><button onclick="removeItem(${i})" class="text-red-400 opacity-0 group-hover:opacity-100">✕</button>`;
                listEl.appendChild(div);
            });
        }

        function removeItem(i) {
            items.splice(i, 1);
            renderList();
        }

        function clearList() {
            if (confirm("Clear the list?")) {
                items = [];
                renderList();
                document.getElementById('result').classList.add('hidden');
            }
        }

        function pickRandom() {
            if (items.length === 0) return alert("Add some options first!");

            const resultDiv = document.getElementById('result');
            const selectedDiv = document.getElementById('selected');

            resultDiv.classList.remove('hidden');
            selectedDiv.textContent = "The cat is deciding...";

            setTimeout(() => {
                const choice = items[Math.floor(Math.random() * items.length)];
                selectedDiv.textContent = choice;
            }, 900);
        }
    </script>
</body>
</html>
